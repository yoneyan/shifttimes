{% extends 'base.html' %}
{% block title %}パスワード再設定 | {% endblock %}
{% block page_title %}パスワード再設定{% endblock %}
{% block page_subtitle %}
  <p class="text-muted small mb-0">登録メールアドレスに再設定用のリンクを送ります。</p>
{% endblock %}
{% block content %}
  <div class="card form-narrow">
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-envelope me-1"></i>再設定メールを送信
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="small">ログイン画面へ戻る</a>
      </div>
    </div>
  </div>
{% endblock content %}
