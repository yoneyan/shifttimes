{% extends 'base.html' %}
{% block title %}ログアウト | {% endblock %}
{% block page_title %}{% if confirm %}ログアウト{% else %}ログアウトしました{% endif %}{% endblock %}
{% block content %}
  <div class="card form-narrow">
    <div class="card-body">
      {% if confirm %}
        <p class="mb-3">ログアウトしますか？</p>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i>ログアウト
          </button>
        </form>
      {% else %}
        <p class="mb-3">ご利用ありがとうございました。</p>
        <a class="btn btn-primary" href="{% url 'login' %}">
          <i class="bi bi-box-arrow-in-right me-1"></i>もう一度ログイン
        </a>
      {% endif %}
    </div>
  </div>
{% endblock content %}
