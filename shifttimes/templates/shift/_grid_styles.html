{# シフト提出状況・シフト作成・確定シフトの表で共通のスタイル #}
<style>
  /* ===== 集計カード ===== */
  .summary-stats {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .summary-stat {
    border: 1px solid #dee2e6;
    border-left-width: .25rem;
    border-radius: .375rem;
    padding: .4rem .75rem;
    min-width: 6.5rem;
    background: #fff;
  }
  .summary-stat .summary-stat-label {
    display: block;
    font-size: .7rem;
    color: #6c757d;
    line-height: 1.2;
  }
  .summary-stat .summary-stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .summary-stat .summary-stat-unit {
    font-size: .7rem;
    font-weight: 400;
    color: #6c757d;
  }
  .summary-stat-done    { border-left-color: #198754; }
  .summary-stat-partial { border-left-color: #fd7e14; }
  .summary-stat-none    { border-left-color: #dc3545; }
  .summary-stat-days    { border-left-color: #0d6efd; }

  /* ===== 凡例 ===== */
  .legend-card {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: .375rem;
    padding: .5rem .75rem;
    font-size: .78rem;
  }
  .legend-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .35rem 1rem;
  }
  .legend-row + .legend-row { margin-top: .4rem; }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
  }
  .legend-rownum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    background: #495057;
    color: #fff;
    font-size: .65rem;
    font-weight: 700;
  }

  /* ===== 表本体 ===== */
  .summary-wrap {
    overflow: auto;
    max-height: 72vh;
    border: 1px solid #dee2e6;
    border-radius: .375rem;
    -webkit-overflow-scrolling: touch;
  }
  .summary-table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: .8rem;
    white-space: nowrap;
    margin: 0;
  }
  .summary-table th,
  .summary-table td {
    border-right: 1px solid #e9ecef;
    border-bottom: 1px solid #e9ecef;
    padding: 0;
    text-align: center;
    vertical-align: middle;
    background: #fff;
  }

  /* 固定列：名前 */
  .summary-table .col-name {
    width: 9rem;
    min-width: 9rem;
    max-width: 9rem;
    padding: .3rem .5rem;
    text-align: left;
    white-space: normal;
    position: sticky;
    left: 0;
    z-index: 2;
    border-right: 1px solid #ced4da;
  }
  /* 固定列：勤務可能日数 */
  .summary-table .col-count {
    width: 4rem;
    min-width: 4rem;
    padding: .2rem .25rem;
    position: sticky;
    left: 9rem;
    z-index: 2;
    background: #fffdf3;
    border-right: 2px solid #ced4da;
  }
  .summary-table thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: #f1f3f5;
    font-weight: 700;
  }
  .summary-table thead .col-name,
  .summary-table thead .col-count { z-index: 4; }
  .summary-table thead .col-count { background: #fff3cd; }
  .summary-table tfoot td {
    position: sticky;
    bottom: 0;
    z-index: 3;
    background: #f8f9fa;
    border-top: 2px solid #ced4da;
  }
  .summary-table tfoot .col-name,
  .summary-table tfoot .col-count { z-index: 4; }

  /* 日付ヘッダー */
  .summary-table .col-date {
    width: 2.9rem;
    min-width: 2.9rem;
    padding: .15rem .1rem;
    line-height: 1.25;
  }
  .summary-table thead .col-date .day-num {
    font-size: .95rem;
    font-weight: 700;
    display: block;
  }
  .summary-table thead .col-date .day-month {
    display: block;
    font-size: .6rem;
    color: #6c757d;
    font-weight: 400;
  }
  .summary-table thead .col-date .day-wd { font-size: .7rem; }

  /* 土日・入力対象外の日 */
  .col-sat .day-num, .col-sat .day-wd { color: #1565c0; }
  .col-sun .day-num, .col-sun .day-wd { color: #c62828; }
  .summary-table .col-weekend { background: #fbfcfe; }
  .summary-table .col-blocked { background: #f6f2f4; }
  .summary-table thead .col-blocked { background: #f3e1e8; }
  .summary-table .col-today { box-shadow: inset 2px 0 0 #0d6efd, inset -2px 0 0 #0d6efd; }
  .summary-table thead .col-today { background: #cfe2ff; }

  /* 未提出メンバーの行 */
  .summary-table tr.row-none .col-name { background: #fff5f5; }
  .summary-table tr.row-none .col-count { background: #fff5f5; }

  /* セル内スロット */
  .slot-stack {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 2px;
  }
  .slot-chip {
    display: block;
    border-radius: .15rem;
    font-size: .7rem;
    font-weight: 700;
    line-height: 1.15rem;
    height: 1.15rem;
  }
  .slot-chip-available   { background: #198754; color: #fff; }
  .slot-chip-maybe       { background: #fd7e14; color: #fff; }
  .slot-chip-unavailable { background: #e9ecef; color: #6c757d; box-shadow: inset 0 0 0 1px #ced4da; }
  .slot-chip-empty       { background: #fff; color: #dee2e6; border: 1px dashed #ced4da; line-height: 1.05rem; }
  .slot-chip-note::after {
    content: "*";
    font-size: .65rem;
    vertical-align: super;
  }

  /* 入力対象外セル */
  .cell-blocked {
    color: #b08ea2;
    font-size: .7rem;
    padding: .3rem .1rem;
  }

  /* 集計値 */
  .count-main { font-size: 1rem; font-weight: 700; display: block; line-height: 1.1; }
  .count-sub  { font-size: .62rem; color: #6c757d; display: block; line-height: 1.1; }

  /* 日別合計 */
  .total-stack {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 2px;
  }
  .total-chip {
    display: block;
    border-radius: .15rem;
    font-size: .7rem;
    font-weight: 700;
    line-height: 1.15rem;
    height: 1.15rem;
    background: #e7f5ec;
    color: #146c43;
  }
  .total-chip-zero { background: #f8f9fa; color: #ced4da; font-weight: 400; }
  /* 必要人数との比較（足りない・要相談を含めれば足りる） */
  .total-chip-short       { background: #f8d7da; color: #b02a37; }
  .total-chip-short-maybe { background: #ffe5d0; color: #ca6510; }
  .total-required { font-size: .6rem; font-weight: 400; }

  /* 提出状況バッジ */
  .status-badge {
    display: inline-block;
    font-size: .62rem;
    font-weight: 700;
    border-radius: .2rem;
    padding: 0 .3rem;
    line-height: 1.1rem;
    color: #fff;
  }
  .status-badge-done    { background: #198754; }
  .status-badge-partial { background: #fd7e14; }
  .status-badge-none    { background: #dc3545; }
  .status-badge-na      { background: #adb5bd; }

  /* 狭い画面では固定列を詰めて日付列を1つでも多く見せる */
  @media (max-width: 576px) {
    .summary-table .col-name {
      width: 6.5rem;
      min-width: 6.5rem;
      max-width: 6.5rem;
      padding: .25rem .35rem;
      font-size: .75rem;
    }
    .summary-table .col-count {
      width: 3.2rem;
      min-width: 3.2rem;
      left: 6.5rem;
    }
    .summary-wrap { max-height: 65vh; }
  }

  /* 開講区分バッジ（ヘッダー） */
  .schedule-badge {
    display: block;
    font-size: .58rem;
    border-radius: .15rem;
    padding: 0 2px;
    margin-top: 1px;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
