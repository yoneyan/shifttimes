{% extends 'base.html' %}
{% block title %}パスワード変更 | {% endblock %}
{% block page_title %}パスワード変更{% endblock %}
{% block page_actions %}
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'custom_auth:index' %}">
    <i class="bi bi-arrow-left me-1"></i>アカウント情報へ戻る
  </a>
{% endblock %}
{% block content %}
  <div class="card form-narrow">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-key me-1"></i>パスワードを変更
        </button>
      </form>
    </div>
  </div>
{% endblock content %}
