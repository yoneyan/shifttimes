{% extends 'base.html' %}
{% block title %}LINE連携が必要です | {% endblock %}
{% block page_header %}{% endblock %}
{% block content %}
  <div class="d-flex justify-content-center">
    <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">このLINEアカウントは連携されていません</h1>
        <p class="text-muted small mb-3">
          LINEでログインするには、先にユーザ名とパスワードでログインし、
          アカウント情報の「LINE連携」から連携してください。
          アカウントをお持ちでない場合は、グループの管理者に登録を依頼してください。
        </p>
        <div class="d-grid gap-2">
          <a class="btn btn-primary" href="{% url 'login' %}">ログイン画面へ</a>
          <a class="btn btn-outline-secondary" href="{% url 'index' %}">トップページへ</a>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
