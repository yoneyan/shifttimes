{% extends 'base.html' %}
{% block title %}エラー | {% endblock %}
{% block page_title %}エラー{% endblock %}
{% block content %}
  <div class="card form-narrow border-danger">
    <div class="card-body">
      {% if error %}<p class="mb-2">{{ error }}</p>{% endif %}
      {% if text %}<p class="mb-3">{{ text }}</p>{% endif %}
      <a class="btn btn-outline-secondary" href="{% url 'index' %}">
        <i class="bi bi-house me-1"></i>ホームへ戻る
      </a>
    </div>
  </div>
{% endblock content %}
