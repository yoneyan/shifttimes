name: Release

# v で始まるタグ（例: v1.2.3, v1.3.0-rc.1）を push すると、
#   1. テストを実行し
#   2. Docker イメージを GitHub Container Registry (ghcr.io) に公開し
#   3. 前回タグからの変更点を本文にした GitHub Release を作成する
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    with:
      skip-docker-build: true

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # v1.2.3 → 1.2.3 / 1.2 / 1 / latest（プレリリースタグでは latest・1.2・1 は付かない）
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          # 前回タグとの差分を取るため、全履歴とタグを取得する
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          else
            RANGE="${TAG}"
          fi

          {
            echo "## 変更点"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "${PREV_TAG} からの変更"
            else
              echo "初回リリース"
            fi
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "${RANGE}"
            echo
            echo
            echo "## Docker Image"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE_NAME}:${VERSION}"
            echo '```'
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.notes.outputs.prev_tag }}
        run: |
          set -euo pipefail
          args=(--title "${TAG}" --notes-file release-notes.md --generate-notes --verify-tag)
          if [ -n "${PREV_TAG}" ]; then
            args+=(--notes-start-tag "${PREV_TAG}")
          fi
          # v1.2.3-rc.1 のようにハイフンを含むタグはプレリリース扱い
          if [[ "${TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"
