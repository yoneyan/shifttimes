name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  # release.yaml からタグ push 時に呼び出し、テストが通った場合のみイメージを公開する
  workflow_call:
    inputs:
      skip-docker-build:
        description: "Docker イメージのビルド確認をスキップする（リリース側で本ビルドする場合）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv はメジャーバージョンだけのタグ（v10 など）を提供していないため完全なバージョンで固定する
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run system checks
        # 警告も含めて失敗扱いにする（設定ミスやモデル定義の問題を早めに検出する）
        run: uv run --frozen python manage.py check --fail-level WARNING

      - name: Check for missing migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run

      - name: Run tests
        # --shuffle でテストの実行順を毎回変え、テスト間の依存を検出する。
        # 失敗時はログの "Used shuffle seed" を --shuffle <seed> に渡すと同じ順序で再現できる
        run: uv run --frozen coverage run manage.py test --shuffle --verbosity 2

      - name: Coverage report
        # pyproject.toml の fail_under を下回るとこのステップが失敗する
        run: |
          uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          uv run --frozen coverage report

      - name: Generate HTML coverage report
        if: ${{ !cancelled() }}
        run: uv run --frozen coverage html

      - name: Upload HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv はメジャーバージョンだけのタグ（v10 など）を提供していないため完全なバージョンで固定する
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run --frozen ruff check --output-format=github .

  docker-build:
    name: Docker build check
    if: ${{ !inputs.skip-docker-build }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
