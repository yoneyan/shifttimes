version: 2
updates:
  # Python 依存（pyproject.toml / uv.lock）
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions のアクション
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dockerfile のベースイメージ
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
