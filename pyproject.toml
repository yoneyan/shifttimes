[project]
name = "shifttimes"
version = "0.1.0"
description = "シフトの登録・共有・集計を行うシフト管理システム"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6",
    "django-configurations",
    "django-debug-toolbar",
    "django-mathfilters",
    "django-qrcode",
    "django-simple-history",
    "django-widget-tweaks",
    "pyotp",
    "qrcode",
    "slack-sdk",
    "stripe",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
# 本番コンテナでのみ必要な WSGI/ASGI サーバ（Dockerfile から --group prod で導入）
prod = [
    "daphne",
    "gunicorn",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "*/migrations/*",
    "static",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20
