[project]
name = "shifttimes"
version = "0.1.0"
description = "シフトの登録・共有・集計を行うシフト管理システム"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6",
    "django-configurations",
    "django-debug-toolbar",
    "django-mathfilters",
    "django-simple-history",
    "django-widget-tweaks",
    "pyotp",
    "qrcode",
    "slack-sdk",
    "stripe",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
    "ruff>=0.16.2",
]
# 本番コンテナでのみ必要な WSGI/ASGI サーバ（Dockerfile から --group prod で導入）
prod = [
    "daphne",
    "gunicorn",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "*/migrations/*",
    "static",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "UP031", # % 形式の文字列整形はコードベース全体の書き方として許容する
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "manage.py",
    "shifttimes/asgi.py",
    "shifttimes/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
# この値を下回ると coverage report が失敗する（CI でカバレッジの後退を検出する）。
# テストを追加してカバレッジが上がったら、それに合わせて引き上げる
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
